<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MoodCast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="app-container">

  <!-- App Name -->
  <header class="app-header">
    <span class="app-name">MoodCast</span>
  </header>

  <!-- Search Bar -->
  <form id="search-form" class="search-form">
    <input 
      type="text" 
      id="city-input" 
      placeholder="Enter city (e.g. New York, Tokyo)..." 
      autocomplete="off"
      required 
    />
    <button type="button" id="locate-btn" class="locate-btn" aria-label="Use my location" title="Use my location">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 L12 5"></path>
        <path d="M12 19 L12 22"></path>
        <path d="M2 12 L5 12"></path>
        <path d="M19 12 L22 12"></path>
        <circle cx="12" cy="12" r="6"></circle>
      </svg>
    </button>
    <button type="submit" aria-label="Search">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
  </form>

  <!-- Weather Card -->
  <div id="weather-card" class="weather-card">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
      <div class="spinner"></div>
    </div>

    <div class="card-content">
      <div class="location-header">
        <h1 id="city-name" class="city-name">--</h1>
        <p id="weather-desc" class="weather-desc">Enter a location above</p>
      </div>

      <!-- Temperature Row: condition icon + big number -->
      <div class="temperature-row">
        <span id="weather-icon" class="weather-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 17a4 4 0 010-8 5.5 5.5 0 0110.6-1.5A4.2 4.2 0 0117.5 17h-11z"></path>
          </svg>
        </span>
        <div class="temperature-container">
          <span id="temperature" class="temperature">--</span>
          <span class="degree-symbol">°C</span>
        </div>
      </div>

      <div class="unit-toggle" role="group" aria-label="Temperature unit">
        <button type="button" id="unit-c" class="unit-btn active" data-unit="C">°C</button>
        <button type="button" id="unit-f" class="unit-btn" data-unit="F">°F</button>
      </div>

      <!-- Tagline / Quote Box -->
      <div class="tagline-wrapper">
        <p id="tagline" class="tagline">"Search a city to get its current weather and mood."</p>
      </div>

      <!-- Weather Stats Breakdown -->
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13.5V4a2 2 0 114 0v9.5a4 4 0 11-4 0z"></path>
              <line x1="12" y1="7" x2="12" y2="13"></line>
            </svg>
          </span>
          <span id="feels-like" class="stat-value">--</span>
          <span class="stat-label">Feels Like</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3s6 7 6 11a6 6 0 01-12 0c0-4 6-11 6-11z"></path>
            </svg>
          </span>
          <span id="humidity" class="stat-value">--</span>
          <span class="stat-label">Humidity</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8h9.5a2.5 2.5 0 100-5"></path>
              <path d="M3 12h13.5a2.5 2.5 0 110 5"></path>
              <path d="M3 16h7a2 2 0 110 4"></path>
            </svg>
          </span>
          <span id="wind-speed" class="stat-value">--</span>
          <span class="stat-label">Wind</span>
        </div>
      </div>
    </div>

  </div>

</main>

<script src="index.js"></script>
</body>
</html>
